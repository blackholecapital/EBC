name: Deploy EBC to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infra/**"
      - "scripts/cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: ebc-cloudflare-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBC_DASHBOARD_D1_ID: ${{ vars.EBC_DASHBOARD_D1_ID }}
      EBC_EVENTS_D1_ID: ${{ vars.EBC_EVENTS_D1_ID }}

    steps:
      - name: Check out EBC
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install deployment tools
        run: npm ci

      - name: Install dashboard dependencies
        run: npm --prefix apps/frontend ci

      - name: Validate application
        run: npm test

      - name: Render Cloudflare resource IDs
        run: npm run cf:render

      - name: Apply D1 schema
        run: npm run cf:migrate

      - name: Deploy Workers and Pages
        run: npm run cf:deploy

      - name: Verify production endpoints
        run: npm run cf:verify
