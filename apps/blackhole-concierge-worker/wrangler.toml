# Everything Built Custom concierge. The directory name remains for source compatibility;
# every deployable target and binding in this file is EBC-only.

name = "ebc-concierge-worker"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[vars]
TENANT_ID = "ebc"
CORPORATE_ID = "ebc"
DEFAULT_LOCATION_ID = "corporate"
TENANT_MODE = "corporate-franchise"
TENANT_PROFILE = "custom-cart-accessories"
CREDENTIAL_PROFILE = "xyz-demo"
BRAND_NAME = "Everything Built Custom"
ASSISTANT_NAME = "EBC AI"
PUBLIC_BASE_URL = "https://ebc-concierge-worker.cryptocapitalgroupfl.workers.dev"
DASHBOARD_URL = "https://ebc-dashboard-worker.cryptocapitalgroupfl.workers.dev"
DOCUSIGN_BASE_PATH = "https://demo.docusign.net/restapi"
DOCUSIGN_RETURN_URL = "https://ebc-concierge-worker.cryptocapitalgroupfl.workers.dev"
DOCUSIGN_SELECTION_CUTOFF_MS = "1786309440000"

[[secrets_store_secrets]]
binding = "SHARED_GOOGLE_CLIENT_ID"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_GOOGLE_CLIENT_ID"

[[secrets_store_secrets]]
binding = "SHARED_GOOGLE_CLIENT_SECRET"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_GOOGLE_CLIENT_SECRET"

[[secrets_store_secrets]]
binding = "SHARED_GOOGLE_REFRESH_TOKEN"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_GOOGLE_REFRESH_TOKEN"

[[secrets_store_secrets]]
binding = "SHARED_DOCUSIGN_ACCOUNT_ID"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_DOCUSIGN_ACCOUNT_ID"

[[secrets_store_secrets]]
binding = "SHARED_DOCUSIGN_INTEGRATION_KEY"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_DOCUSIGN_INTEGRATION_KEY"

[[secrets_store_secrets]]
binding = "SHARED_DOCUSIGN_USER_ID"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_DOCUSIGN_USER_ID"

[[d1_databases]]
binding = "DB"
database_name = "ebc-call-center-events"
database_id = "REPLACE_WITH_EBC_EVENTS_D1_ID"

[[r2_buckets]]
binding = "DOCUMENT_ARCHIVE"
bucket_name = "ebc-call-center-archive"

[[services]]
binding = "SMS"
service = "ebc-sms-worker"

[[services]]
binding = "EMAIL"
service = "ebc-email-worker"

[[services]]
binding = "VOICE"
service = "ebc-voice-worker"

[[queues.producers]]
binding = "EVENTS"
queue = "ebc-communication-events"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ebc_message_events"
